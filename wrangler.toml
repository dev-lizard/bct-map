# The Cloudflare Worker that serves the API to the GitHub Pages site (see docs/DEPLOY.md).
#   npx wrangler dev        run it locally (reads .dev.vars)
#   npx wrangler deploy     publish it
name = "broward-transit-3d"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Logs in the Cloudflare dashboard (Workers & Pages > broward-transit-3d > Logs).
[observability]
enabled = true

[vars]
# Your GitHub Pages site, where the Worker reads the timetable. The Deploy Worker workflow sets
# it from the repository name; set it here only if you deploy from your own machine.
PAGES_URL = "https://YOUR-GITHUB-USER.github.io/YOUR-REPO"
# Secret, not set here: CONTRACT_FEED_BASE, the contracted routes' feeds (docs/DEPLOY.md, step 5b).

# Every minute: record on-time performance and check BCT's feeds (worker/recorder.js).
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "RECORDER"
class_name = "Recorder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Recorder"]
