<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broward Transit</title>
    <meta name="description" content="Broward County Transit service, live and measured, for BCT staff." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="./style.css" rel="stylesheet" />
    <!-- MapLibre GL draws the OpenFreeMap basemap, the routes and the buses. No API key needed. -->
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <!-- Filled by web/sidebar.js once the timetable has loaded. -->
    <nav id="rail" class="panel rail" aria-label="Panels"></nav>
    <div class="left-column">
      <div id="status" class="panel">
        <div class="header-line">
          <div class="clock"><span id="date"></span> <strong id="clock"></strong></div>
        </div>
        <div id="status-text" role="status">Loading…</div>
        <div id="radar-note" class="radar-note" hidden></div>
        <div id="filter-note" class="filter-note" hidden></div>
      </div>
      <section id="sidebar" class="panel sidebar" aria-label="Routes, search, alerts and settings" hidden></section>
    </div>
    <aside id="panel" class="panel detail" aria-label="Stop or trip details" hidden></aside>
    <div id="toast" class="panel toast" role="status" hidden></div>
    <script src="./runtime-config.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
